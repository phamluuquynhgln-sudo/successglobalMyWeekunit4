<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>My Week - Queen English Center</title>
<style>
:root{
  --bg:#eef3ff; --card:#ffffff; --pri:#4f6bed; --pri2:#7c5cf0;
  --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6;
  --ink:#16233a; --mut:#64748b; --gold:#f59e0b; --line:#dbe3f5;
  --r:16px; --tap:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100dvh; overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:60;box-shadow:0 2px 12px rgba(30,50,120,.22)}
#brand{
  background:#111c37;color:#f5cf6b;text-align:center;
  font-size:10.5px;font-weight:900;letter-spacing:2.1px;text-transform:uppercase;
  padding:5px 8px;padding-top:calc(5px + env(safe-area-inset-top));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#bar{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;
}
#foot{
  text-align:center;font-size:10.5px;font-weight:700;color:#9aa7c2;
  letter-spacing:.7px;padding:4px 12px 22px;line-height:1.5;
}
#bar .ico{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:21px;
}
#bar .ico:active{transform:scale(.92)}
#ttl{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ttl small{display:block;font-weight:600;font-size:11.5px;opacity:.85;letter-spacing:.2px}
#pts{flex:0 0 auto;background:rgba(255,255,255,.22);border-radius:999px;
  padding:7px 12px;font-weight:800;font-size:14px;white-space:nowrap}

#wrap{max-width:520px;margin:0 auto;padding:12px 12px 26px}

/* ---------- generic ---------- */
.h1{font-size:clamp(21px,6vw,27px);font-weight:900;text-align:center;margin:8px 0 2px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);font-size:13.5px;margin:0 0 10px;font-weight:600}
.cbadge{display:block;width:fit-content;margin:0 auto 15px;
  background:linear-gradient(135deg,#111c37,#26365e);color:#f5cf6b;
  border-radius:999px;padding:7px 16px;font-size:11.5px;font-weight:900;
  letter-spacing:1.6px;text-transform:uppercase;
  box-shadow:0 3px 10px rgba(17,28,55,.28)}
.card{background:var(--card);border-radius:var(--r);padding:14px;
  box-shadow:0 3px 14px rgba(30,50,120,.09);border:1px solid var(--line)}
.q{font-size:16px;font-weight:800;text-align:center;margin:2px 0 12px;line-height:1.35}
.q .vi{display:block;color:var(--mut);font-weight:600;font-size:13px;margin-top:3px}

/* ---------- menu ---------- */
.lvl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;margin-bottom:10px;box-shadow:0 3px 12px rgba(30,50,120,.08);
  transition:transform .12s}
.lvl:active{transform:scale(.98)}
.lvl .n{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(135deg,#e8ecff,#f3e9ff)}
.lvl .t{flex:1;min-width:0}
.lvl .t b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.lvl .t span{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px;line-height:1.3}
.lvl .go{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--pri);
  background:#eef1ff;border-radius:999px;padding:6px 10px;white-space:nowrap}
.lvl.dn .go{color:var(--ok);background:var(--okbg)}
.tot{text-align:center;font-weight:800;color:var(--mut);font-size:13px;margin:14px 0 4px}

/* ---------- calendar picture ---------- */
.cal{width:100%;max-width:132px;margin:0 auto;border-radius:12px;overflow:hidden;
  background:#fff;border:2px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.cal .ch{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;font-weight:900;
  font-size:9.5px;letter-spacing:1.6px;padding:4px 0;text-align:center}
.cal .cd{font-size:clamp(18px,6.2vw,26px);font-weight:900;letter-spacing:.5px;
  padding:13px 0 7px;text-align:center;color:var(--ink)}
.cal .cw{display:flex;justify-content:center;gap:4px;padding:0 0 11px}
.cal .cw i{width:7px;height:7px;border-radius:50%;background:#e2e8f0;display:block}
.cal .cw i.on{background:var(--pri);transform:scale(1.45)}
.emo{font-size:clamp(44px,14.5vw,62px);line-height:1.15;text-align:center;
  padding:20px 0 17px;display:block}
.plabel{text-align:center;font-size:12px;font-weight:700;color:var(--mut);
  padding-bottom:9px;line-height:1.2}

/* ---------- options ---------- */
.mid{min-height:calc(100dvh - 215px);display:flex;flex-direction:column;justify-content:center}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 4px;
  min-height:var(--tap);transition:transform .1s,border-color .15s,background .15s}
.opt:active{transform:scale(.96)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg);animation:sh .34s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.tops{display:grid;grid-template-columns:1fr;gap:9px;margin-top:6px}
.top{background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:13px 14px;min-height:var(--tap);font-size:15px;font-weight:700;
  text-align:left;line-height:1.35;transition:transform .1s,border-color .15s,background .15s}
.top:active{transform:scale(.985)}
.top.ok{border-color:var(--ok);background:var(--okbg)}
.top.no{border-color:var(--bad);background:var(--badbg);animation:sh .34s}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;min-height:var(--tap);border-radius:14px;font-weight:800;
  font-size:15.5px;padding:14px;margin-top:11px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;
  box-shadow:0 4px 12px rgba(79,107,237,.32)}
.btn:active{transform:scale(.98)}
.btn.g{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 4px 12px rgba(22,163,74,.3)}
.btn.w{background:#fff;color:var(--pri);border:2px solid var(--line);box-shadow:none}
.spk{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:13px 22px;border-radius:999px;font-weight:800;font-size:15px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;
  box-shadow:0 4px 14px rgba(79,107,237,.35);margin:2px auto 4px}
.spk:active{transform:scale(.96)}
.spk.sm{background:#eef1ff;color:var(--pri);box-shadow:none;padding:10px 16px;
  min-height:44px;font-size:13.5px}
.ctr{text-align:center}

/* ---------- level 2 : build sentence ---------- */
.slot{min-height:66px;background:#f8faff;border:2px dashed #c7d2fe;border-radius:14px;
  padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-bottom:11px}
.slot.ok{border-color:var(--ok);border-style:solid;background:var(--okbg)}
.slot.no{border-color:var(--bad);border-style:solid;background:var(--badbg);animation:sh .34s}
.bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{background:var(--card);border:2px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:15px;font-weight:700;min-height:44px;
  box-shadow:0 2px 6px rgba(30,50,120,.08)}
.chip:active{transform:scale(.94)}
.chip.used{opacity:.28;pointer-events:none}
.chip.in{background:#eef1ff;border-color:#c7d2fe;box-shadow:none}

/* ---------- level 3/4 : matching ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcard{background:var(--card);border:2px solid var(--line);border-radius:13px;
  padding:12px 9px;min-height:var(--tap);font-size:14.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;
  transition:transform .1s,border-color .15s,background .15s;position:relative}
.mcard:active{transform:scale(.96)}
.mcard.sel{border-color:var(--pri);background:#eef1ff;box-shadow:0 0 0 3px rgba(79,107,237,.16)}
.mcard.ok{border-color:var(--ok);background:var(--okbg);opacity:.62;pointer-events:none}
.mcard.no{border-color:var(--bad);background:var(--badbg);animation:sh .34s}
.mcard .bg{position:absolute;top:-7px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--ok);color:#fff;font-size:11.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.mstack{display:flex;flex-direction:column;gap:7px}
.mstack .mcard{justify-content:flex-start;text-align:left;font-size:14px;padding:12px 13px}
.mhead{font-size:11.5px;font-weight:900;color:var(--mut);letter-spacing:1px;
  margin:12px 0 6px;text-transform:uppercase}
.mhead:first-child{margin-top:2px}

/* ---------- level 5 : reading ---------- */
.story{background:linear-gradient(180deg,#fffdf5,#fff);border:1px solid #fde68a;
  border-radius:var(--r);padding:14px;font-size:15px;line-height:1.72;
  box-shadow:0 3px 12px rgba(180,140,20,.1)}
.story b{color:#b45309;font-weight:800}
.story .t{font-weight:900;font-size:16px;margin-bottom:7px;color:#92400e}
#stxt{transition:max-height .25s}
#stxt.cl{max-height:74px;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 42%,transparent);
  mask-image:linear-gradient(#000 42%,transparent)}

/* ---------- learn cards ---------- */
.lcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;
  margin-bottom:9px;box-shadow:0 2px 9px rgba(30,50,120,.07)}
.lcard:active{transform:scale(.985);background:#f7f9ff}
.lcard .pic{width:74px;flex:0 0 74px;display:flex;align-items:center;justify-content:center}
.lcard .pic .cal{max-width:74px}
.lcard .pic .emo{font-size:38px;padding:6px 0}
.lcard .tx{flex:1;min-width:0}
.lcard .tx b{display:block;font-size:16px;font-weight:800}
.lcard .tx span{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-top:2px}
.lcard .sp{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:#eef1ff;
  display:flex;align-items:center;justify-content:center;font-size:19px}

/* ---------- feedback / result ---------- */
.fb{text-align:center;font-weight:900;font-size:16px;margin-top:11px;min-height:22px}
.fb.g{color:var(--ok)} .fb.r{color:var(--bad)}
.big{font-size:58px;text-align:center;line-height:1.1;margin:6px 0}
.stars{text-align:center;font-size:27px;letter-spacing:2px;margin:6px 0}
.rrow{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;
  padding:9px 2px;border-bottom:1px dashed var(--line)}
.rrow:last-child{border:0}
.pbar{height:8px;background:#e6ebfa;border-radius:99px;overflow:hidden;margin:9px 0 2px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));
  border-radius:99px;transition:width .3s}
#cfx{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.cf{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.1}}
.hint{text-align:center;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:9px;line-height:1.45}
.warn{background:#fff8e6;border:1px solid #fcd34d;border-radius:13px;padding:11px 13px;
  font-size:12.5px;font-weight:600;color:#7c5a10;line-height:1.55;margin-top:12px;text-align:left}
</style>
</head>
<body>
<div id="top">
  <div id="brand">&#128081; Queen English Center</div>
  <div id="bar">
    <button class="ico" id="homeBtn" aria-label="Home">&#127968;</button>
    <div id="ttl">My Week<small>Days &amp; activities</small></div>
    <div id="pts">&#11088; 0</div>
  </div>
</div>
<div id="wrap"><div id="screen"></div></div>
<div id="foot"></div>
<div id="cfx"></div>

  {t:"Make a Sentence",       vi:"Sắp xếp từ thành câu",     ico:"🧩", n:NW},
  {t:"Match the Words",       vi:"Nối từ Anh – Việt",        ico:"🔤", n:NW},
  {t:"Match the Sentences",   vi:"Nối câu Anh – Việt",       ico:"🔗", n:NW},
  {t:"Read &amp; Answer",     vi:"Đọc hiểu và trả lời",      ico:"📖", n:NQ}
];
const NL = LEVELS.length;

/* split N indices into roughly-equal rounds of at most `max` cards */
function seq(n){ return Array.from({length:n}, function(_,i){ return i; }); }
function rounds(n, max){
  var ids = shuffle(seq(n)), k = Math.max(1, Math.ceil(n / max)), out = [], p = 0;
  for(var r = 0; r < k; r++){
    var take = Math.ceil((n - p) / (k - r));
    out.push(ids.slice(p, p + take)); p += take;
  }
  return out;
}

/* ---------- audio ----------------------------------------------------------
   iPhone rules everything here. Two hard iOS Safari constraints:
     1. A <audio> element may only start playing from inside a real user
        gesture — UNLESS it has been "blessed": played once during a gesture.
        After that the same element can be re-sourced and replayed any time.
     2. Sound produced ONLY by WebAudio is treated as ambient audio and is
        silenced by the hardware Ring/Silent switch. Sound coming out of a
        blessed <audio> element uses the playback session and is not.
   So every sound in this game — speech AND the ding/buzz effects — goes
   through two long-lived <audio> elements that are blessed on the first tap.
   WebAudio and speechSynthesis stay only as fallbacks for odd browsers.    */

var PL = null, FX = null, AC = null, BUF = {}, CUR = null;
var URLS = {}, UNLOCKED = false, ARMED = false;

function b64bytes(b64){
  var bin = atob(b64), n = bin.length, a = new Uint8Array(n);
  for(var i = 0; i < n; i++) a[i] = bin.charCodeAt(i);
  return a;
}
/* Blob URLs, not data: URIs — iOS Safari is far more reliable with them
   on <audio>, and a 78 KB data: URI as a src is a known weak spot. */
function clipURL(key){
  if(URLS[key]) return URLS[key];
  var b = (window.CLIPS||{})[key];
  if(!b) return null;
  try{ URLS[key] = URL.createObjectURL(new Blob([b64bytes(b)], {type:"audio/mpeg"})); }
  catch(e){ URLS[key] = "data:audio/mpeg;base64," + b; }
  return URLS[key];
}
function mkAudio(){
  var a = document.createElement("audio");
  a.preload = "auto";
  a.setAttribute("playsinline", "");
  a.setAttribute("webkit-playsinline", "");
  a.crossOrigin = "anonymous";
  document.body.appendChild(a);
  return a;
}
/* Must be called synchronously inside a touch/click handler. */
function unlock(){
  if(!PL){ PL = mkAudio(); FX = mkAudio(); }
  var sil = clipURL("fx_silent");
  [PL, FX].forEach(function(a){
    try{
      if(sil && !a.dataset.blessed){
        a.src = sil; a.muted = false; a.volume = 1;
        var p = a.play();
        if(p && p.then) p.then(function(){ a.pause(); a.currentTime = 0;
                                           a.dataset.blessed = "1"; }).catch(function(){});
        else { a.dataset.blessed = "1"; }
      }
    }catch(e){}
  });
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var s = AC.createBufferSource();          /* 1-frame silent buffer, in-gesture */
    s.buffer = AC.createBuffer(1, 1, 22050);
    s.connect(AC.destination); s.start(0);
    if(AC.state !== "running" && AC.resume) AC.resume();
  }catch(e){ AC = null; }
  UNLOCKED = true;
  return true;
}
/* iOS can drop the context back to suspended/interrupted after a call, a
   screen lock or the ringer switch — so keep re-arming, never listen "once". */
function armUnlock(){
  if(ARMED) return;
  ARMED = true;
  var h = function(){ unlock(); };
  document.addEventListener("touchend", h, {passive:true});
  document.addEventListener("click", h);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && AC && AC.state !== "running" && AC.resume){
      try{ AC.resume(); }catch(e){}
    }
  });
}
function stopAudio(){
  if(PL){ try{ PL.pause(); }catch(e){} }
  if(CUR){ try{ CUR.onended = null; CUR.stop(0); }catch(e){} CUR = null; }
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}
/* --- the one function the game calls --- */
function play(key, cb){
  stopAudio();
  if(!(window.CLIPS||{})[key]){ sayFallback(key, cb); return; }
  if(!PL) unlock();
  var url = clipURL(key);
  var done = false, fin = function(){ if(!done){ done = true; if(cb) cb(); } };
  try{
    PL.onended = fin;
    PL.onerror = function(){ if(!done){ done = true; webPlay(key, cb); } };
    PL.src = url;
    PL.currentTime = 0;
    var p = PL.play();
    if(p && p.catch) p.catch(function(){ if(!done){ done = true; webPlay(key, cb); } });
  }catch(e){ webPlay(key, cb); }
}
/* fallback 1 — WebAudio (works where <audio> is blocked, e.g. some WebViews) */
function webPlay(key, cb){
  var b = (window.CLIPS||{})[key];
  if(!b || !AC){ sayFallback(key, cb); return; }
  var go = function(buf){
    try{
      var s = AC.createBufferSource();
      s.buffer = buf; s.connect(AC.destination); CUR = s;
      s.onended = function(){ if(CUR === s) CUR = null; if(cb) cb(); };
      s.start(0);
    }catch(e){ sayFallback(key, cb); }
  };
  if(BUF[key]){ go(BUF[key]); return; }
  try{
    var p = AC.decodeAudioData(b64bytes(b).buffer,
      function(buf){ if(!BUF[key]){ BUF[key] = buf; go(buf); } },
      function(){ sayFallback(key, cb); });
    if(p && p.then) p.then(function(buf){ if(!BUF[key]){ BUF[key] = buf; go(buf); } })
                     .catch(function(){ sayFallback(key, cb); });
  }catch(e){ sayFallback(key, cb); }
}
/* fallback 2 — the device voice. Last resort only: it is the very thing the
   embedded MP3s exist to avoid, because it differs on every phone. */
function sayFallback(key, cb){
  var t = (window.TEXTS||{})[key] || "";
  try{
    if(!t || !window.speechSynthesis){ if(cb) cb(); return; }
    var u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US"; u.rate = 0.75;
    u.onend = function(){ if(cb) cb(); };
    u.onerror = function(){ if(cb) cb(); };
    speechSynthesis.speak(u);
  }catch(e){ if(cb) cb(); }
}
/* --- effects: own element so a ding never cuts off the word being spoken --- */
function fx(key){
  if(!FX) return;
  var url = clipURL(key);
  if(!url) return;
  try{ FX.src = url; FX.currentTime = 0; var p = FX.play(); if(p && p.catch) p.catch(function(){}); }
  catch(e){}
}
function sndOk(){ fx("fx_ok"); }
function sndNo(){ fx("fx_no"); }
function sndWin(){ fx("fx_win"); }
/* true when audio is definitely working — used by the sound self-test */
function audioState(){
  return { blessed: !!(PL && PL.dataset.blessed), ctx: AC ? AC.state : "none",
           clips: Object.keys(window.CLIPS||{}).length };
}
/* ---------- state ---------- */
var S = { level:0, queue:[], pos:0, tries:{}, score:0, lscore:0,
          done:new Array(NL).fill(false), best:new Array(NL).fill(0),
          sel:null, matched:0, round:0, rounds:[] };

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
var $ = function(id){ return document.getElementById(id); };
function el(){ return $("screen"); }
function setBar(t, sub, showPts){
  $("ttl").innerHTML = t + "<small>" + sub + "</small>";
  $("pts").style.display = showPts === false ? "none" : "";
  $("pts").innerHTML = "⭐ " + S.score;
}
function confetti(){
  var box = $("cfx"), cols = ["#4f6bed","#7c5cf0","#f59e0b","#16a34a","#e11d48","#06b6d4"];
  for(var i=0;i<42;i++){
    var d = document.createElement("div");
    d.className = "cf";
    d.style.left = Math.random()*100 + "vw";
    d.style.top = "-20px";
    d.style.background = cols[i%cols.length];
    d.style.animationDuration = (1.5 + Math.random()*1.3) + "s";
    d.style.animationDelay = (Math.random()*.5) + "s";
    box.appendChild(d);
    setTimeout(function(x){ return function(){ x.remove(); }; }(d), 3400);
  }
}

/* ---------- pictures ---------- */
function calHTML(i){
  var w = WORDS[i], dots = "";
  for(var k=0;k<7;k++) dots += '<i class="' + (k===w.pos?"on":"") + '"></i>';
  return '<div class="cal"><div class="ch">MY WEEK</div>'
       + '<div class="cd">' + w.abbr + '</div><div class="cw">' + dots + '</div></div>';
}
function picHTML(i, label){
  var w = WORDS[i];
  var body = w.kind === "day" ? calHTML(i) : '<span class="emo">' + w.emo + '</span>';
  return body + (label ? '<div class="plabel">' + esc(w.w) + '</div>' : '');
}

/* ---------- start gate ----------
   The whole game is behind one tap. That tap is what blesses the <audio>
   elements, so from here on every sound is allowed to play by itself. */
var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
       || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function startGate(){
  setBar(GAME_TITLE, GAME_SUB, false);
  el().innerHTML =
      '<div class="mid ctr">'
    + '<div class="h1">' + GAME_TITLE + '</div>'
    + '<div class="cbadge">👑 ' + CENTER + '</div>'
    + '<div class="big">🔊</div>'
    + '<button class="btn" id="goBtn" style="font-size:18px;padding:19px">Chạm để bắt đầu</button>'
    + (IOS ? '<div class="warn">📱 <b>iPhone / iPad:</b> gạt nút chuông bên cạnh máy sang '
           + '<b>bật chuông</b> (không để chế độ im lặng) và vặn to âm lượng, '
           + 'nếu không sẽ không nghe thấy tiếng.</div>' : '')
    + '<div class="hint">Chạm 1 lần để mở âm thanh — sau đó bài nghe tự phát.</div>'
    + '</div>';
  $("goBtn").onclick = function(){

    play("w0", null);        /* proves the pipe works, right inside the gesture */

/* ---------- sound self-test ---------- */
function soundTest(){
  unlock();
  var box = $("stBox");
  box.style.display = ""; box.innerHTML = '<b>Đang phát thử…</b>';
  var heard = false;
  play("w0", function(){ heard = true; });
  setTimeout(function(){
    var st = audioState();
    box.innerHTML = heard
      ? '<b style="color:var(--ok)">✅ Âm thanh chạy tốt.</b><br>Nếu vẫn không nghe: tăng âm lượng máy'
        + (IOS ? ', và gạt nút chuông bên cạnh iPhone sang <b>bật chuông</b>.' : '.')
      : '<b style="color:var(--bad)">⚠️ Chưa phát được.</b><br>'
        + (IOS ? 'Gạt nút chuông bên cạnh iPhone sang <b>bật chuông</b>, tăng âm lượng, '
               + 'rồi mở lại file bằng <b>Safari</b> (không mở trong Zalo/Messenger).'
               : 'Tăng âm lượng, rồi mở lại file bằng Chrome.')
        + '<br><small style="color:var(--mut)">' + st.ctx + ' · '
        + (st.blessed ? 'audio ok' : 'audio chưa mở') + ' · ' + st.clips + ' clip</small>';
  }, 2200);
}

/* ---------- navigation ---------- */
$("homeBtn").onclick = function(){ stopAudio(); goHome(); };

function goHome(){
  S.sel = null;
  setBar(GAME_TITLE, GAME_SUB);
  var totMax = 0, tot = 0, h = "";
  h += '<div class="h1">' + GAME_TITLE + '</div>';
  h += '<div class="sub">' + MENU_SUB + '</div>';
  h += '<div class="cbadge">👑 ' + CENTER + '</div>';
  h += '<button class="lvl" onclick="showLearn()"><div class="n">📖</div>'
     + '<div class="t"><b>Learn the words</b><span>Học 10 từ – chạm để nghe</span></div>'
     + '<div class="go">Mở</div></button>';
  for(var i=0;i<NL;i++){
    var L = LEVELS[i], mx = L.n*10; totMax += mx; tot += S.best[i];
    h += '<button class="lvl' + (S.done[i] ? " dn" : "") + '" onclick="startLevel(' + i + ')">'
       + '<div class="n">' + L.ico + '</div>'
       + '<div class="t"><b>Level ' + (i+1) + '. ' + L.t + '</b><span>' + L.vi + ' · ' + L.n + ' câu</span></div>'
       + '<div class="go">' + (S.done[i] ? "✅ " + S.best[i] + "/" + mx : "▶ Chơi") + '</div></button>';
  }
  h += '<div class="pbar"><i style="width:' + Math.round(tot/totMax*100) + '%"></i></div>';
  h += '<div class="tot">⭐ ' + tot + ' / ' + totMax + ' điểm</div>';
  h += '<div class="ctr"><button class="spk sm" onclick="soundTest()">🔊 Kiểm tra âm thanh</button></div>';
  h += '<div class="warn" id="stBox" style="display:none"></div>';
  if(S.done.every(Boolean)){
    h += '<div class="card ctr" style="margin-top:10px"><div class="big">🏆</div>'
       + '<b style="font-size:16px">Well done! You finished all ' + NL + ' levels!</b></div>';
  }
  el().innerHTML = h;
  window.scrollTo(0,0);
}

/* ---------- learn the words ---------- */
function showLearn(){
  setBar("📖 Learn the words", "Chạm vào thẻ để nghe", false);
  var h = '<div class="hint" style="margin:0 0 12px">Chạm vào từng thẻ để nghe phát âm 🔊</div>';
  for(var i=0;i<WORDS.length;i++){
    h += '<button class="lcard" onclick="play(\'w' + i + '\')">'
       + '<div class="pic">' + picHTML(i, false) + '</div>'
       + '<div class="tx"><b>' + esc(WORDS[i].w) + '</b><span>' + WORDS[i].vi + '</span></div>'
       + '<div class="sp">🔊</div></button>';
  }
  h += '<button class="btn" onclick="goHome()">✅ Xong, chơi thôi!</button>';
  el().innerHTML = h;
  window.scrollTo(0,0);
}

/* ---------- level runner ---------- */
function startLevel(l){
  S.level = l; S.pos = 0; S.tries = {}; S.lscore = 0;
  S.sel = null; S.matched = 0; S.round = 0;
  unlock();
  if(l === 2){ S.rounds = rounds(NW, 5); S.queue = []; }        /* short words  → 5 pairs */
  else if(l === 3){ S.rounds = rounds(NW, 4); S.queue = []; }   /* long sentences → 4 pairs */
  else if(l === 4){ S.queue = seq(NQ); }                        /* story order, not shuffled */
  else { S.queue = shuffle(seq(NW)); }
  render();
}
function levelBar(){
  var L = LEVELS[S.level], tot = L.n, dn;
  if(S.level === 2 || S.level === 3) dn = S.matched; else dn = S.pos;
  setBar("Level " + (S.level+1) + ". " + L.t, dn + " / " + tot + " · " + L.vi);
}
function award(key){
  var t = S.tries[key] || 0;
  var p = t === 0 ? 10 : 5;
  S.score += p; S.lscore += p;
  return p;
}
function markTry(key){ S.tries[key] = (S.tries[key]||0) + 1; }

function render(){
  levelBar();
  if(S.level === 2 || S.level === 3){ renderMatch(); return; }
  if(S.pos >= S.queue.length){ levelDone(); return; }
  [q1, q2, null, null, q5][S.level]();
  window.scrollTo(0,0);
}
function next(){ S.pos++; setTimeout(render, 620); }

/* ---------- LEVEL 1 : listen and choose the picture ---------- */
function q1(){
  var i = S.queue[S.pos];
  var same = [], other = [];
  WORDS.forEach(function(w, k){
    if(k === i) return;
    (w.kind === WORDS[i].kind ? same : other).push(k);
  });
  var d = shuffle(same).concat(shuffle(other)).slice(0, 2);
  var opts = shuffle([i].concat(d));
  var h = '<div class="mid">'
        + '<div class="ctr"><button class="spk" onclick="play(\'w' + i + '\')">🔊 Nghe lại</button></div>'
        + '<div class="q">Listen and choose the right picture'
        + '<span class="vi">Nghe rồi chọn tranh đúng</span></div>'
        + '<div class="opts">';
  opts.forEach(function(k){
    h += '<button class="opt" data-k="' + k + '" onclick="pick1(this,' + k + ',' + i + ')">'
       + picHTML(k, false) + '</button>';
  });
  h += '</div><div class="fb" id="fb"></div>'
     + '<div class="hint">Câu ' + (S.pos+1) + ' / ' + S.queue.length + '</div></div>';
  el().innerHTML = h;
  setTimeout(function(){ play("w" + i); }, 260);
}
function pick1(btn, k, i){
  if(k === i){
    btn.classList.add("ok"); sndOk();
    var p = award("L1-" + i);
    $("fb").className = "fb g"; $("fb").innerHTML = "✅ " + esc(WORDS[i].w) + " · +" + p + " ⭐";
    document.querySelectorAll(".opt").forEach(function(b){ b.onclick = null; });
    next();
  }else{
    btn.classList.add("no"); sndNo(); markTry("L1-" + i);
    $("fb").className = "fb r"; $("fb").innerHTML = "❌ Nghe lại nhé!";
    btn.onclick = null;
    setTimeout(function(){ play("w" + i); }, 420);
  }
}

/* ---------- LEVEL 2 : put the words in order ---------- */
var BUILD = [];
function q2(){
  var i = S.queue[S.pos];
  var target = SENT[i].en.replace(/[.?!]$/, "");
  var toks = target.split(" ");
  BUILD = [];
  var h = '<div class="q">Make a sentence<span class="vi">' + esc(SENT[i].vi) + '</span></div>'
        + '<div class="slot" id="slot"></div>'
        + '<div class="bank" id="bank"></div>'
        + '<div class="ctr" style="margin-top:12px">'
        + '<button class="spk sm" onclick="play(\'s' + i + '\')">🔊 Nghe câu mẫu</button></div>'
        + '<div class="fb" id="fb"></div>';
  el().innerHTML = h;
  var bank = $("bank"), order = shuffle(toks.map(function(t,x){ return x; }));
  order.forEach(function(x){
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = toks[x]; b.dataset.x = x;
    b.onclick = function(){ addTok(b, toks[x], i, toks.length, target); };
    bank.appendChild(b);
  });
  drawSlot(i, toks.length, target);
}
function drawSlot(i, n, target){
  var s = $("slot");
  s.innerHTML = "";
  BUILD.forEach(function(o, idx){
    var b = document.createElement("button");
    b.className = "chip in"; b.textContent = o.t;
    b.onclick = function(){
      o.el.classList.remove("used");
      BUILD.splice(idx, 1);
      drawSlot(i, n, target);
    };
    s.appendChild(b);
  });
  if(!BUILD.length) s.innerHTML = '<span style="color:#94a3b8;font-size:13px;font-weight:600;padding:6px">'
    + 'Chạm vào các từ bên dưới…</span>';
}
function addTok(b, t, i, n, target){
  b.classList.add("used");
  BUILD.push({t:t, el:b});
  drawSlot(i, n, target);
  if(BUILD.length === n) check2(i, n, target);
}
function check2(i, n, target){
  var got = BUILD.map(function(o){ return o.t; }).join(" ");
  var slot = $("slot");
  if(got === target){
    slot.classList.add("ok"); sndOk();
    var p = award("L2-" + i);
    $("fb").className = "fb g";
    $("fb").innerHTML = "✅ " + esc(SENT[i].en) + " · +" + p + " ⭐";
    document.querySelectorAll("#bank .chip,#slot .chip").forEach(function(x){ x.onclick = null; });
    play("s" + i);
    S.pos++; setTimeout(render, 1500);
  }else{
    slot.classList.add("no"); sndNo(); markTry("L2-" + i);
    $("fb").className = "fb r";
    $("fb").innerHTML = "❌ Chưa đúng, thử lại nhé!";
    setTimeout(function(){
      slot.classList.remove("no");
      BUILD.forEach(function(o){ o.el.classList.remove("used"); });
      BUILD = [];
      drawSlot(i, n, target);
      $("fb").innerHTML = "";
    }, 900);
  }
}

/* ---------- LEVEL 3 & 4 : matching ---------- */
function renderMatch(){
  var isWord = S.level === 2;
  if(S.round >= S.rounds.length){ levelDone(); return; }
  var ids = S.rounds[S.round];
  var L = ids.slice(), R = shuffle(ids);
  var h;
  if(isWord){
    h = '<div class="q">Match English with Vietnamese'
      + '<span class="vi">Nối từ tiếng Anh với nghĩa tiếng Việt</span></div>'
      + '<div class="mgrid"><div class="mcol">';
    L.forEach(function(k){ h += mcard(k, "en", esc(WORDS[k].w)); });
    h += '</div><div class="mcol">';
    R.forEach(function(k){ h += mcard(k, "vi", esc(WORDS[k].vi)); });
    h += '</div></div>';
  }else{
    h = '<div class="q">Match English with Vietnamese'
      + '<span class="vi">Nối câu tiếng Việt với câu tiếng Anh</span></div>'
      + '<div class="mhead">🇻🇳 Tiếng Việt</div><div class="mstack">';
    L.forEach(function(k){ h += mcard(k, "vi", esc(SENT[k].vi)); });
    h += '</div><div class="mhead">🇬🇧 English</div><div class="mstack">';
    R.forEach(function(k){ h += mcard(k, "en", esc(SENT[k].en)); });
    h += '</div>';
  }
  h += '<div class="fb" id="fb"></div>'
     + '<div class="hint">Chạm 1 thẻ bên này rồi chạm thẻ tương ứng để nối.</div>';
  el().innerHTML = h;
  S.sel = null;
  window.scrollTo(0,0);
}
function mcard(k, side, txt){
  return '<button class="mcard" id="m-' + side + '-' + k + '" onclick="tapM(' + k + ',\'' + side + '\')">' + txt + '</button>';
}
function tapM(k, side){
  var me = $("m-" + side + "-" + k);
  if(S.sel && S.sel.side === side && S.sel.k === k){ me.classList.remove("sel"); S.sel = null; return; }
  if(S.sel && S.sel.side === side){ $("m-" + S.sel.side + "-" + S.sel.k).classList.remove("sel"); S.sel = null; }
  if(!S.sel){
    S.sel = {k:k, side:side};
    me.classList.add("sel");
    if(S.level === 2) play("w" + k); else if(side === "en") play("s" + k);
    return;
  }
  var a = S.sel, b = {k:k, side:side};
  var other = $("m-" + a.side + "-" + a.k);
  if(a.k === b.k){
    other.classList.remove("sel");
    other.classList.add("ok"); me.classList.add("ok");
    S.matched++;
    var n = S.matched;
    other.insertAdjacentHTML("beforeend", '<span class="bg">' + n + '</span>');
    me.insertAdjacentHTML("beforeend", '<span class="bg">' + n + '</span>');
    sndOk();
    var p = award("L" + (S.level+1) + "-" + a.k);
    $("fb").className = "fb g"; $("fb").innerHTML = "✅ +" + p + " ⭐";
    if(S.level === 2) play("w" + a.k); else play("s" + a.k);
    S.sel = null;
    levelBar();
    if(document.querySelectorAll(".mcard.ok").length === S.rounds[S.round].length * 2){
      S.round++;
      setTimeout(function(){ if(S.round >= S.rounds.length){ levelDone(); } else { renderMatch(); levelBar(); } }, 900);
    }
  }else{
    markTry("L" + (S.level+1) + "-" + a.k);
    me.classList.add("no"); other.classList.add("no"); other.classList.remove("sel");
    sndNo();
    $("fb").className = "fb r"; $("fb").innerHTML = "❌ Chưa đúng rồi!";
    S.sel = null;
    setTimeout(function(){
      me.classList.remove("no"); other.classList.remove("no");
      if($("fb")) $("fb").innerHTML = "";
    }, 620);
  }
}

/* ---------- LEVEL 5 : read and answer ---------- */
function q5(){
  var i = S.queue[S.pos];
  var Q = STORYQ[i];
  var idx = shuffle([0,1,2]);
  var cl = i === 0 ? "" : " cl";
  var h = '<div class="story"><div class="t">📖 ' + esc(STORY_TITLE) + '</div>'
        + '<div id="stxt" class="' + cl.trim() + '">' + STORY + '</div></div>'
        + '<div class="ctr" style="margin-top:10px">'
        + '<button class="spk sm" onclick="play(\'story\')">🔊 Nghe bài đọc</button> '
        + '<button class="spk sm" id="tgl" onclick="tglStory()">'
        + (i === 0 ? "🔼 Thu gọn" : "🔽 Xem lại bài") + '</button></div>'
        + '<div class="q" style="margin-top:14px">Question ' + (i+1) + ' / 5<span class="vi">'
        + esc(Q.q) + '</span></div>'
        + '<div class="ctr"><button class="spk sm" onclick="play(\'q' + i + '\')">🔊 Nghe câu hỏi</button></div>'
        + '<div class="tops">';
  idx.forEach(function(k){
    h += '<button class="top" onclick="pick5(this,' + k + ',' + i + ')">'
       + '<b style="color:var(--pri)">' + "ABC".charAt(idx.indexOf(k)) + '.</b> ' + esc(Q.o[k]) + '</button>';
  });
  h += '</div><div class="fb" id="fb"></div>';
  el().innerHTML = h;
}
function tglStory(){
  var s = $("stxt"), b = $("tgl");
  var cl = s.classList.toggle("cl");
  b.innerHTML = cl ? "🔽 Xem lại bài" : "🔼 Thu gọn";
}
function pick5(btn, k, i){
  var Q = STORYQ[i];
  if(k === Q.a){
    btn.classList.add("ok"); sndOk();
    var p = award("L5-" + i);
    $("fb").className = "fb g"; $("fb").innerHTML = "✅ Đúng rồi! +" + p + " ⭐";
    document.querySelectorAll(".top").forEach(function(b){ b.onclick = null; });
    next();
  }else{
    btn.classList.add("no"); sndNo(); markTry("L5-" + i);
    btn.onclick = null;
    $("fb").className = "fb r";
    $("fb").innerHTML = "❌ Đọc lại bài rồi thử lại nhé!";
  }
}

/* ---------- level finished ---------- */
function levelDone(){
  var L = LEVELS[S.level], mx = L.n * 10;
  S.done[S.level] = true;
  if(S.lscore > S.best[S.level]) S.best[S.level] = S.lscore;
  var pct = S.lscore / mx;
  var st = pct >= 1 ? 3 : pct >= 0.8 ? 2 : 1;
  var msg = pct >= 1 ? "Perfect! Tuyệt vời!" : pct >= 0.8 ? "Great job! Rất tốt!" : "Good try! Cố lên nhé!";
  setBar(GAME_TITLE, GAME_SUB);
  sndWin(); confetti();
  var h = '<div class="card ctr"><div class="big">🎉</div>'
    + '<div style="font-size:18px;font-weight:900">Level ' + (S.level+1) + ' xong!</div>'
    + '<div class="stars">' + "⭐".repeat(st) + "☆".repeat(3-st) + '</div>'
    + '<div style="font-size:15px;font-weight:800;color:var(--pri)">' + S.lscore + ' / ' + mx + ' điểm</div>'
    + '<div style="font-size:13.5px;color:var(--mut);font-weight:700;margin:5px 0 12px">' + msg + '</div>'
    + '<div class="cbadge" style="margin-bottom:2px">👑 ' + CENTER + '</div></div>';
  var nx = S.level + 1;
  if(nx < NL) h += '<button class="btn g" onclick="startLevel(' + nx + ')">▶ Level ' + (nx+1) + ': ' + LEVELS[nx].t + '</button>';
  h += '<button class="btn' + (nx < NL ? " w" : "") + '" onclick="startLevel(' + S.level + ')">🔁 Chơi lại level này</button>';
  h += '<button class="btn w" onclick="goHome()">🏠 Về trang chính</button>';
  el().innerHTML = h;
  window.scrollTo(0,0);
}

/* ---------- boot ---------- */
document.title = GAME_TITLE + " - " + CENTER;
$("brand").innerHTML = "👑 " + CENTER;
$("foot").innerHTML = "👑 " + CENTER.toUpperCase() + (GAME_FOOT ? " · " + GAME_FOOT : "");
armUnlock();
startGate();
</script>
